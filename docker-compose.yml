services:
  mongo:
    image: mongo:7
    container_name: stampogen-mongo
    restart: unless-stopped
    volumes:
      - stampogen_mongo_data:/data/db
    networks:
      - stampogen
    # Bound to localhost only — do not expose Mongo publicly
    ports:
      - "127.0.0.1:27018:27017"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stampogen-api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGODB_URI: mongodb://mongo:27017/stampogen
    depends_on:
      - mongo
    networks:
      - stampogen
    # Optional local debug — remove if unused
    ports:
      - "127.0.0.1:5001:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_APP_NAME: Stampogen
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3080}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        BACKEND_URL: http://backend:5000
    container_name: stampogen-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend
    networks:
      - stampogen

  nginx:
    image: nginx:1.27-alpine
    container_name: stampogen-nginx
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      # Shared VPS-friendly: only localhost. Point host Nginx/Caddy here.
      # Change to "3080:80" if you want LAN access without host reverse proxy.
      - "${STAMPOGEN_HTTP_BIND:-127.0.0.1}:${STAMPOGEN_HTTP_PORT:-3081}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - stampogen

networks:
  stampogen:
    driver: bridge

volumes:
  stampogen_mongo_data:
