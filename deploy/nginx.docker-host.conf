# Host Nginx snippet — proxy your domain to the Docker stack on localhost:3081
# (3080 is often used by Invogen marketing on the same VPS)
# Place under /etc/nginx/sites-available/stampogen and enable + certbot.

server {
    listen 80;
    listen [::]:80;
    server_name stampogen.example.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
