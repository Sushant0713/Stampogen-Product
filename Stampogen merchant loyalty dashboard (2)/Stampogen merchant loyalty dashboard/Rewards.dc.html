<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#0B1220;font-family:'Inter',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  * { box-sizing: border-box; }
</style>
</helmet>
<div style="display:flex;justify-content:center;padding:48px 24px;background:#0B1220;min-height:100vh">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" width="{{ 402 }}" height="{{ 874 }}" hint-size="402px,874px">

<div style="min-height:100%;background:#F8FAFC;position:relative;padding:76px 20px 24px;display:flex;flex-direction:column;gap:22px">

  <div style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="font-size:24px;font-weight:800;color:#021A54">Rewards</div>
      <span style="font-size:13px;color:#64748B;font-weight:500">Customers ready to redeem their reward.</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 6px 16px rgba(2,26,84,0.06)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#94A3B8" stroke-width="2"></circle><path d="M21 21L16.5 16.5" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"></path></svg>
      <input type="text" value="{{ search }}" onChange="{{ onSearchChange }}" placeholder="Search name or phone number" style="border:none;outline:none;flex:1;font-size:13px;font-family:inherit;color:#021A54;background:transparent"></input>
    </div>
    <div style="display:flex;gap:8px">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="3">
        <div onClick="{{ f.onClick }}" style="padding:9px 16px;border-radius:12px;font-size:12.5px;font-weight:700;cursor:pointer;background:{{ f.bg }};color:{{ f.color }}" style-active="transform:scale(0.95)">{{ f.label }}</div>
      </sc-for>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <sc-for list="{{ customers }}" as="cu" hint-placeholder-count="5">
      <div style="background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 6px 16px rgba(2,26,84,0.05);display:flex;align-items:center;gap:9px">
        <div style="width:34px;height:34px;border-radius:50%;background:#021A54;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;flex-shrink:0">{{ cu.initials }}</div>
        <div style="display:flex;flex-direction:column;gap:1px;flex:1;min-width:0">
          <span style="font-size:12.5px;font-weight:700;color:#021A54;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ cu.name }}</span>
          <span style="font-size:11px;color:#475569;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ cu.offer }} · {{ cu.reward }}</span>
        </div>
        <sc-if value="{{ cu.redeemed }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;align-items:center;gap:4px;background:rgba(34,197,94,0.1);border-radius:9px;padding:7px 9px;font-size:10px;font-weight:700;color:#22C55E;flex-shrink:0">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#22C55E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            Given
          </div>
        </sc-if>
        <sc-if value="{{ cu.notRedeemed }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;gap:6px;flex-shrink:0">
            <div onClick="{{ cu.onVerify }}" style="padding:8px 10px;border-radius:9px;font-size:10.5px;font-weight:700;cursor:pointer;background:{{ cu.verifyBg }};color:{{ cu.verifyColor }};border:1.3px solid #E2E8F0;white-space:nowrap" style-active="transform:scale(0.94)">{{ cu.verifyLabel }}</div>
            <div onClick="{{ cu.onGive }}" style="padding:8px 10px;border-radius:9px;font-size:10.5px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#021A54,#3B82F6);color:#fff;box-shadow:0 6px 14px rgba(2,26,84,0.2);white-space:nowrap" style-active="transform:scale(0.94)">Give</div>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="margin-top:auto;position:sticky;bottom:22px;align-self:center;display:flex;gap:4px;background:rgba(255,255,255,0.85);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border-radius:26px;padding:8px;box-shadow:0 16px 36px rgba(2,26,84,0.18),0 0 0 1px rgba(2,26,84,0.05)">
    <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="5">
      <div onClick="{{ item.onClick }}" style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 13px;border-radius:18px;cursor:pointer;background:{{ item.bg }}" style-active="transform:scale(0.92)">
        <span style="font-size:18px">{{ item.emoji }}</span>
        <span style="font-size:9px;font-weight:700;color:{{ item.color }}">{{ item.label }}</span>
      </div>
    </sc-for>
  </div>

</div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    activeFilter: 'pending',
    activeTab: 'rewards',
    search: '',
    customers: [
      { id: 1, name: 'Rahul Sharma', phone: '+91 98765 43210', offer: 'Buy 5 Get 1 Free', emoji: '☕', reward: 'Free Coffee', verified: false, redeemed: false },
      { id: 2, name: 'Priya Verma', phone: '+91 91234 56780', offer: 'Pizza Lovers Club', emoji: '🍕', reward: 'Free Pizza', verified: false, redeemed: false },
      { id: 3, name: 'Amit Singh', phone: '+91 99887 66554', offer: 'Burger Bonanza', emoji: '🍔', reward: 'Free Burger', verified: true, redeemed: false },
      { id: 4, name: 'Neha Gupta', phone: '+91 90011 22334', offer: 'Dessert Rewards', emoji: '🍩', reward: 'Free Dessert', verified: false, redeemed: true },
      { id: 5, name: 'Karan Mehta', phone: '+91 97766 55443', offer: 'VIP Gift Card', emoji: '🎁', reward: 'Gift Voucher', verified: false, redeemed: false },
    ],
  };

  toggleVerify(id) {
    this.setState(s => ({ customers: s.customers.map(c => c.id === id ? { ...c, verified: !c.verified } : c) }));
  }
  giveReward(id) {
    this.setState(s => ({ customers: s.customers.map(c => c.id === id ? { ...c, redeemed: true } : c) }));
  }
  initialsOf(name) {
    return name.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
  }

  renderVals() {
    const filterDefs = [
      { id: 'pending', label: 'Pending' },
      { id: 'redeemed', label: 'Redeemed' },
    ];
    const filters = filterDefs.map(f => {
      const sel = f.id === this.state.activeFilter;
      return {
        ...f,
        bg: sel ? '#021A54' : '#fff',
        color: sel ? '#fff' : '#64748B',
        onClick: () => this.setState({ activeFilter: f.id }),
      };
    });

    const q = this.state.search.trim().toLowerCase();
    const visible = this.state.customers.filter(c => {
      const matchesFilter = this.state.activeFilter === 'pending' ? !c.redeemed : this.state.activeFilter === 'redeemed' ? c.redeemed : true;
      const matchesSearch = !q || c.name.toLowerCase().includes(q) || c.phone.replace(/\s/g, '').includes(q.replace(/\s/g, ''));
      return matchesFilter && matchesSearch;
    });

    const customers = visible.map(c => ({
      ...c,
      initials: this.initialsOf(c.name),
      notRedeemed: !c.redeemed,
      verifyLabel: c.verified ? 'Verified' : 'Verify',
      verifyBg: c.verified ? 'rgba(59,130,246,0.1)' : '#fff',
      verifyColor: c.verified ? '#3B82F6' : '#64748B',
      onVerify: () => this.toggleVerify(c.id),
      onGive: () => this.giveReward(c.id),
    }));

    const navDefs = [
      { id: 'home', emoji: '🏠', label: 'Home' },
      { id: 'offers', emoji: '🎁', label: 'Offers' },
      { id: 'rewards', emoji: '🏆', label: 'Rewards' },
      { id: 'customers', emoji: '👥', label: 'Customers' },
      { id: 'profile', emoji: '⚙️', label: 'Profile' },
    ];
    const pages = {
      home: 'Stampogen Dashboard.dc.html',
      offers: 'Offers.dc.html',
      rewards: 'Rewards.dc.html',
      customers: 'Customers.dc.html',
      profile: 'Profile.dc.html',
    };
    const navItems = navDefs.map(item => {
      const active = item.id === this.state.activeTab;
      return {
        ...item,
        bg: active ? 'rgba(59,130,246,0.14)' : 'transparent',
        color: active ? '#3B82F6' : '#94A3B8',
        onClick: () => { window.location.href = pages[item.id]; },
      };
    });

    return {
      filters, customers, navItems, search: this.state.search,
      onSearchChange: (e) => this.setState({ search: e.target.value }),
    };
  }
}

</script>
</body>
</html>
