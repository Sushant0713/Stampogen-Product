<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#0B1220;font-family:'Inter',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  * { box-sizing: border-box; }
</style>
</helmet>
<div style="display:flex;justify-content:center;padding:48px 24px;background:#0B1220;min-height:100vh">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" width="{{ 402 }}" height="{{ 874 }}" hint-size="402px,874px">

<div style="min-height:100%;background:#F8FAFC;position:relative;padding:76px 20px 24px;display:flex;flex-direction:column;gap:22px">

  <div style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="font-size:24px;font-weight:800;color:#021A54">Customers</div>
      <span style="font-size:13px;color:#64748B;font-weight:500">Everyone who has scanned your loyalty QR.</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 6px 16px rgba(2,26,84,0.06)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#94A3B8" stroke-width="2"></circle><path d="M21 21L16.5 16.5" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"></path></svg>
      <input type="text" value="{{ search }}" onChange="{{ onSearchChange }}" placeholder="Search name or phone number" style="border:none;outline:none;flex:1;font-size:13px;font-family:inherit;color:#021A54;background:transparent"></input>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <sc-for list="{{ customers }}" as="cu" hint-placeholder-count="6">
      <div style="background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 8px 20px rgba(2,26,84,0.05);display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:38px;height:38px;border-radius:50%;background:#021A54;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex-shrink:0">{{ cu.initials }}</div>
          <div style="display:flex;flex-direction:column;gap:1px;flex:1;min-width:0">
            <span style="font-size:13px;font-weight:700;color:#021A54;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ cu.name }}</span>
            <span style="font-size:10.5px;color:#94A3B8;font-weight:600">{{ cu.phone }}</span>
          </div>
          <div style="display:flex;align-items:center;gap:5px;background:rgba(59,130,246,0.1);padding:6px 10px;border-radius:9px;flex-shrink:0">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#3B82F6" stroke-width="2"></circle></svg>
            <span style="font-size:10.5px;font-weight:700;color:#3B82F6">{{ cu.stampsLabel }}</span>
          </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;padding-left:48px">
          <div style="display:flex;align-items:center;gap:5px">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M3 12C5.5 7 8.5 4.5 12 4.5C15.5 4.5 18.5 7 21 12C18.5 17 15.5 19.5 12 19.5C8.5 19.5 5.5 17 3 12Z" stroke="#94A3B8" stroke-width="1.7"></path><circle cx="12" cy="12" r="2.7" stroke="#94A3B8" stroke-width="1.7"></circle></svg>
            <span style="font-size:11px;color:#64748B;font-weight:600">{{ cu.visits }} visits</span>
          </div>
          <div onClick="{{ cu.onToggleHistory }}" style="display:flex;align-items:center;gap:4px;cursor:pointer" style-active="transform:scale(0.95)">
            <span style="font-size:11px;font-weight:700;color:#021A54">History</span>
            <svg width="9" height="9" viewBox="0 0 12 12" style="transform:{{ cu.chevronRotate }}"><path d="M2 4l4 4 4-4" stroke="#021A54" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </div>
        </div>

        <sc-if value="{{ cu.historyOpen }}" hint-placeholder-val="{{ false }}">
          <div style="margin-left:48px;background:#F8FAFC;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:11px;color:#64748B;font-weight:600">Total stamps received</span>
              <span style="font-size:13px;color:#021A54;font-weight:800">{{ cu.totalStamps }}</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:11px;color:#64748B;font-weight:600">Rewards redeemed</span>
              <span style="font-size:13px;color:#021A54;font-weight:800">{{ cu.rewardsRedeemed }}</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:11px;color:#64748B;font-weight:600">Last visit</span>
              <span style="font-size:12px;color:#021A54;font-weight:700">{{ cu.lastVisit }}</span>
            </div>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="margin-top:auto;position:sticky;bottom:22px;align-self:center;display:flex;gap:4px;background:rgba(255,255,255,0.85);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border-radius:26px;padding:8px;box-shadow:0 16px 36px rgba(2,26,84,0.18),0 0 0 1px rgba(2,26,84,0.05)">
    <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="5">
      <div onClick="{{ item.onClick }}" style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 13px;border-radius:18px;cursor:pointer;background:{{ item.bg }}" style-active="transform:scale(0.92)">
        <span style="font-size:18px">{{ item.emoji }}</span>
        <span style="font-size:9px;font-weight:700;color:{{ item.color }}">{{ item.label }}</span>
      </div>
    </sc-for>
  </div>

</div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    activeTab: 'customers',
    search: '',
    openHistoryId: null,
    customers: [
      { id: 1, name: 'Rahul Sharma', phone: '+91 98765 43210', stampsHave: 3, stampsTotal: 5, visits: 8, totalStamps: 23, rewardsRedeemed: 2, lastVisit: '2 days ago' },
      { id: 2, name: 'Priya Verma', phone: '+91 91234 56780', stampsHave: 5, stampsTotal: 5, visits: 12, totalStamps: 41, rewardsRedeemed: 4, lastVisit: 'Today' },
      { id: 3, name: 'Amit Singh', phone: '+91 99887 66554', stampsHave: 5, stampsTotal: 5, visits: 15, totalStamps: 55, rewardsRedeemed: 5, lastVisit: 'Today' },
      { id: 4, name: 'Neha Gupta', phone: '+91 90011 22334', stampsHave: 2, stampsTotal: 4, visits: 4, totalStamps: 10, rewardsRedeemed: 1, lastVisit: '1 week ago' },
      { id: 5, name: 'Karan Mehta', phone: '+91 97766 55443', stampsHave: 1, stampsTotal: 8, visits: 2, totalStamps: 3, rewardsRedeemed: 0, lastVisit: '3 weeks ago' },
      { id: 6, name: 'Sneha Rao', phone: '+91 96655 44332', stampsHave: 4, stampsTotal: 6, visits: 9, totalStamps: 19, rewardsRedeemed: 2, lastVisit: '4 days ago' },
    ],
  };

  initialsOf(name) {
    return name.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
  }

  renderVals() {
    const q = this.state.search.trim().toLowerCase();
    const visible = this.state.customers.filter(c => {
      if (!q) return true;
      return c.name.toLowerCase().includes(q) || c.phone.replace(/\s/g, '').includes(q.replace(/\s/g, ''));
    });

    const customers = visible.map(c => ({
      ...c,
      initials: this.initialsOf(c.name),
      stampsLabel: `${c.stampsHave}/${c.stampsTotal}`,
      historyOpen: this.state.openHistoryId === c.id,
      chevronRotate: this.state.openHistoryId === c.id ? 'rotate(180deg)' : 'rotate(0deg)',
      onToggleHistory: () => this.setState(s => ({ openHistoryId: s.openHistoryId === c.id ? null : c.id })),
    }));

    const navDefs = [
      { id: 'home', emoji: '🏠', label: 'Home' },
      { id: 'offers', emoji: '🎁', label: 'Offers' },
      { id: 'rewards', emoji: '🏆', label: 'Rewards' },
      { id: 'customers', emoji: '👥', label: 'Customers' },
      { id: 'profile', emoji: '⚙️', label: 'Profile' },
    ];
    const pages = {
      home: 'Stampogen Dashboard.dc.html',
      offers: 'Offers.dc.html',
      rewards: 'Rewards.dc.html',
      customers: 'Customers.dc.html',
      profile: 'Profile.dc.html',
    };
    const navItems = navDefs.map(item => {
      const active = item.id === this.state.activeTab;
      return {
        ...item,
        bg: active ? 'rgba(59,130,246,0.14)' : 'transparent',
        color: active ? '#3B82F6' : '#94A3B8',
        onClick: () => { window.location.href = pages[item.id]; },
      };
    });

    return {
      customers, navItems, search: this.state.search,
      onSearchChange: (e) => this.setState({ search: e.target.value }),
    };
  }
}

</script>
</body>
</html>
