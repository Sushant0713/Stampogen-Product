# Stampogen — Nginx site (shared VPS)
# 1. Replace stampogen.example.com with your domain
# 2. sudo cp deploy/nginx.stampogen.conf /etc/nginx/sites-available/stampogen
# 3. sudo ln -sf /etc/nginx/sites-available/stampogen /etc/nginx/sites-enabled/
# 4. sudo nginx -t && sudo systemctl reload nginx
# 5. sudo certbot --nginx -d stampogen.example.com
#
# Frontend: 127.0.0.1:3001  |  Backend is reached via Next.js /api/v1 rewrite → :5001

server {
    listen 80;
    listen [::]:80;
    server_name stampogen.example.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
